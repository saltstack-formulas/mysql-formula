# -*- coding: utf-8 -*-
# vim: ft=yaml
---
Debian:
  service: mysql

Ubuntu:
  service: mariadb
  serverpkg: mariadb-server
  clientpkg: mariadb-client
  devpkg: libmariadbclient-dev
  pythonpkg: python3-mysqldb
  config:
    sections:
      mysqld:
        tmpdir: /tmp
        log_error: /var/log/mysql/error.log
    append: |
      !includedir /etc/mysql/conf.d/
      # !includedir /etc/mysql/mariadb.conf.d/

Fedora:
  pythonpkg: python3-mysqlclient

Amazon:
  clientpkg: mariadb123
  serverpkg: mariadb123-server
  service: mariadb
  pythonpkg: PyMySQL # pip package, there is no system package at this time
